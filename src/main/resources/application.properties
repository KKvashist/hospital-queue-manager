spring.application.name=hospital-queue-manager
server.port=8080

# ---- MySQL connection (edit username/password for your machine) ----
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password

# Run src/main/resources/schema.sql on every start (it only uses CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# ---- Notification implementation: console (default) or email ----
app.notification.type=console
