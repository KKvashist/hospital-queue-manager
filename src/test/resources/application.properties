# Test configuration: H2 in MySQL-compatibility mode so the tests run without a MySQL server.
spring.datasource.url=jdbc:h2:mem:hospital_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
app.notification.type=console
